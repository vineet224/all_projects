services:
  redis-lab:
    image: redis:latest
    container_name: redis-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --loglevel notice
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_lab_data:/data

volumes:
  redis_lab_data:
    driver: local

